<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/css-loader/2.2.0/css-loader.css" 
  />
    <link rel="stylesheet" href="./css/styles.css" />
    
  </head>
  <body>
    <main>
      <form class="form">
        <label>
          <input
            type="text"
            name="search-text"
            placeholder="Search images..."
            required
          />
        </label>
        <button type="submit">Search</button>
        
      </form>
      <ul class="gallery"></ul>
       <button type="button" data-loadmore style="display: none;">Load more</button>
      

      <div class="loader loader-default"></div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
